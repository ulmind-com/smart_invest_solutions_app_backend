[project]
name = "smart-invest-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samiran2004", email = "samiran.samanta.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cloudinary>=1.46.0",
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "motor>=3.7.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
smart-invest-backend = "smart_invest_backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
