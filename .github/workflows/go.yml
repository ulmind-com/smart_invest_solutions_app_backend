# This workflow will build, test, and perform a hard-level stress benchmark on the Go backend
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Build & Hard-Level Stress Test

on:
  push:
    branches: [ "main", "samiran" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-stress-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Build
      run: go build -v ./...

    - name: Unit Tests
      run: go test -v ./...

    - name: 🔥 Hard-Level Backend Stress & Efficiency Benchmark
      run: bash scripts/stress_test.sh
