basePath: /api/v1
definitions:
  github_com_smart-invest-solutions_backend_internal_domain.AccessRequest:
    properties:
      admin_notes:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      status:
        description: PENDING, APPROVED, REJECTED
        type: string
      updated_at:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.AdminLoginRequest:
    properties:
      admin_id:
        example: ADM-7F3K9Q
        type: string
      pin:
        example: "1234"
        type: string
    required:
    - admin_id
    - pin
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ApproveAccessRequestDTO:
    properties:
      admin_notes:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ChangePasswordRequest:
    properties:
      confirm_password:
        type: string
      current_password:
        type: string
      new_password:
        type: string
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateAccessRequestDTO:
    properties:
      email:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateAdminRequest:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateAdminResponse:
    properties:
      admin:
        $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
      admin_id:
        type: string
      credentials_email_sent:
        type: boolean
      email:
        type: string
      temporary_password:
        type: string
      temporary_pin:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateFamilyMemberDTO:
    properties:
      blood_group:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      relation_with_hof:
        type: string
    required:
    - date_of_birth
    - name
    - phone
    - relation_with_hof
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateGeneralInsuranceDTO:
    properties:
      advisor_contact:
        type: string
      advisor_name:
        type: string
      company_name:
        type: string
      date_of_expiry:
        type: string
      policy_no:
        type: string
      vehicle_no:
        type: string
    required:
    - company_name
    - date_of_expiry
    - policy_no
    - vehicle_no
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.Document:
    properties:
      category:
        description: e.g. Aadhaar Card, PAN Card, Bank Passbook, Policy, Custom
        type: string
      created_at:
        type: string
      document_url:
        type: string
      file_size:
        description: in bytes
        type: integer
      file_type:
        type: string
      id:
        type: string
      name:
        type: string
      public_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    required:
    - name
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.DocumentListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.Document'
        type: array
      total:
        type: integer
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.FamilyMember:
    properties:
      blood_group:
        type: string
      created_at:
        type: string
      date_of_birth:
        description: 'Format: YYYY-MM-DD'
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      relation_with_hof:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    required:
    - date_of_birth
    - name
    - phone
    - relation_with_hof
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.FamilyMemberListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.FamilyMember'
        type: array
      total:
        type: integer
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.GeneralInsurance:
    properties:
      advisor_contact:
        type: string
      advisor_name:
        type: string
      company_name:
        type: string
      created_at:
        type: string
      date_of_expiry:
        description: 'Format: YYYY-MM-DD'
        type: string
      id:
        type: string
      policy_no:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      vehicle_no:
        type: string
    required:
    - company_name
    - date_of_expiry
    - policy_no
    - vehicle_no
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.GeneralInsuranceListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.GeneralInsurance'
        type: array
      total:
        type: integer
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.RejectAccessRequestDTO:
    properties:
      reason:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ResetPasswordRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      new_password:
        type: string
      otp:
        type: string
    required:
    - confirm_password
    - email
    - new_password
    - otp
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateFamilyMemberDTO:
    properties:
      blood_group:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      relation_with_hof:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateGeneralInsuranceDTO:
    properties:
      advisor_contact:
        type: string
      advisor_name:
        type: string
      company_name:
        type: string
      date_of_expiry:
        type: string
      policy_no:
        type: string
      vehicle_no:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateProfileRequest:
    properties:
      name:
        type: string
      phone:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateUserRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UserLoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: MyP@ssw0rd
        type: string
    required:
    - email
    - password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UserResponse:
    properties:
      admin_id:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
  github_com_smart-invest-solutions_backend_pkg_response.APIResponse:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      message:
        type: string
      page:
        type: integer
      success:
        type: boolean
      total:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact:
    email: support@ulmind.com
    name: ULMIND Team
  description: |-
    Backend API for Smart Invest Solutions — a LIC Policy & Investment Management Platform.
    This API provides user registration, authentication with JWT, role-based access control, and more.
  title: Smart Invest Solutions API
  version: "1.0"
paths:
  /access-requests:
    get:
      consumes:
      - application/json
      description: Retrieves all access requests with optional filtering by status
        (PENDING, APPROVED, REJECTED).
      parameters:
      - description: 'Filter by status: PENDING, APPROVED, REJECTED'
        in: query
        name: status
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Access requests retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
                  type: array
              type: object
        "401":
          description: Unauthorized — Bearer Token required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all Access Requests (Admin Only)
      tags:
      - Access Requests (Admin)
    post:
      consumes:
      - application/json
      description: Submits a request for access to the platform with Name, Contact
        No, and Email. Status is set to PENDING until approved by an Admin.
      parameters:
      - description: Access Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateAccessRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Access request submitted successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "400":
          description: Bad request (email already exists or pending request exists)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Request for Access (Client Sign up request)
      tags:
      - Access Requests
  /access-requests/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves detailed info for a single access request.
      parameters:
      - description: Access Request ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Access request retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "404":
          description: Request not found
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Access Request by ID (Admin Only)
      tags:
      - Access Requests (Admin)
  /access-requests/{id}/approve:
    post:
      consumes:
      - application/json
      description: Approves a client's access request. Automatically generates a secure
        random password, creates a User account, updates request status to APPROVED,
        and emails login credentials to the client via Resend.
      parameters:
      - description: Access Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional Admin Notes
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.ApproveAccessRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Access request approved, account created, and credentials emailed
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "400":
          description: Bad request (already approved or invalid ID)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Approve Access Request & Email Credentials (Admin Only)
      tags:
      - Access Requests (Admin)
  /access-requests/{id}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a client's access request and marks status as REJECTED.
      parameters:
      - description: Access Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional Rejection Reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.RejectAccessRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Access request rejected
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Reject Access Request (Admin Only)
      tags:
      - Access Requests (Admin)
  /admins:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of all admin and super_admin accounts.
        Only accessible by super_admin.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Admin accounts retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — super_admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all Admin accounts (Super Admin only)
      tags:
      - Admin Accounts
    post:
      consumes:
      - application/json
      description: Creates a new Admin account from Name/Email/Phone. Auto-generates
        a unique Admin ID, a random password, and a 4-digit PIN, then emails the credentials
        to the new admin. The response also returns the plaintext password/PIN once,
        so the Super Admin can share them even if the email fails to deliver. Only
        accessible by super_admin.
      parameters:
      - description: New Admin details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Admin account created successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateAdminResponse'
              type: object
        "400":
          description: Bad request (e.g. email already in use)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — super_admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Create Admin account (Super Admin only)
      tags:
      - Admin Accounts
  /admins/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently deletes an admin account and its associated data. Self-deletion
        is disallowed — use the account settings delete option instead. Only accessible
        by super_admin.
      parameters:
      - description: Admin User ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Admin account deleted successfully
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — super_admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete Admin account (Super Admin only)
      tags:
      - Admin Accounts
  /admins/login:
    post:
      consumes:
      - application/json
      description: Authenticates an admin or super_admin account using AdminID + PIN.
        Normal users (client/advisor) cannot log in through this endpoint — use POST
        /users/login instead. Returns a JWT token containing the user's role. Accounts
        lock for 15 minutes after 5 consecutive failed attempts.
      parameters:
      - description: Login credentials — Admin ID and 4-digit PIN
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful — returns JWT token and user details with
            role
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.LoginResponse'
              type: object
        "401":
          description: Invalid credentials, account disabled, or account temporarily
            locked
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Login (admin/super_admin)
      tags:
      - Authentication
  /documents:
    get:
      consumes:
      - application/json
      description: Retrieves list of all documents uploaded by the user with optional
        search query filter `q`.
      parameters:
      - description: Search filter by name or category (e.g. aadhaar, pan, passbook)
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Documents retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.DocumentListResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get & Search E-Vault documents
      tags:
      - E-Vault Documents
    post:
      consumes:
      - multipart/form-data
      description: Uploads a PDF or image file with auto-compression to Cloudinary
        and saves metadata to MongoDB E-Vault.
      parameters:
      - description: Document File (PDF, PNG, JPG, JPEG)
        in: formData
        name: file
        required: true
        type: file
      - description: Document Name (e.g., Aadhaar Card)
        in: formData
        name: name
        required: true
        type: string
      - description: Category (Aadhaar, PAN, Bank Passbook, Policy, Custom)
        in: formData
        name: category
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Document uploaded successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.Document'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Upload document to E-Vault
      tags:
      - E-Vault Documents
  /documents/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes document record from MongoDB and purges file from Cloudinary
        storage.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Document deleted successfully
