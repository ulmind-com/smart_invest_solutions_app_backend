basePath: /api/v1
definitions:
  github_com_smart-invest-solutions_backend_internal_domain.AccessRequest:
    properties:
      admin_notes:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      status:
        description: PENDING, APPROVED, REJECTED
        type: string
      updated_at:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ApproveAccessRequestDTO:
    properties:
      admin_notes:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ChangePasswordRequest:
    properties:
      confirm_password:
        type: string
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateAccessRequestDTO:
    properties:
      email:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      role:
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.RejectAccessRequestDTO:
    properties:
      reason:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ResetPasswordRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      new_password:
        minLength: 8
        type: string
      otp:
        type: string
    required:
    - confirm_password
    - email
    - new_password
    - otp
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateProfileRequest:
    properties:
      name:
        type: string
      phone:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
  github_com_smart-invest-solutions_backend_pkg_response.APIResponse:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      message:
        type: string
      page:
        type: integer
      success:
        type: boolean
      total:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact:
    email: support@ulmind.com
    name: ULMIND Team
  description: |-
    Backend API for Smart Invest Solutions — a LIC Policy & Investment Management Platform.
    This API provides user registration, authentication with JWT, role-based access control, and more.
  title: Smart Invest Solutions API
  version: "1.0"
paths:
  /access-requests:
    get:
      consumes:
      - application/json
      description: Retrieves all access requests with optional filtering by status
        (PENDING, APPROVED, REJECTED).
      parameters:
      - description: 'Filter by status: PENDING, APPROVED, REJECTED'
        in: query
        name: status
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Access requests retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
                  type: array
              type: object
        "401":
          description: Unauthorized — Bearer Token required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all Access Requests (Admin Only)
      tags:
      - Access Requests (Admin)
    post:
      consumes:
      - application/json
      description: Submits a request for access to the platform with Name, Contact
        No, and Email. Status is set to PENDING until approved by an Admin.
      parameters:
      - description: Access Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateAccessRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Access request submitted successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "400":
          description: Bad request (email already exists or pending request exists)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Request for Access (Client Sign up request)
      tags:
      - Access Requests
  /access-requests/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves detailed info for a single access request.
      parameters:
      - description: Access Request ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Access request retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "404":
          description: Request not found
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Access Request by ID (Admin Only)
      tags:
      - Access Requests (Admin)
  /access-requests/{id}/approve:
    post:
      consumes:
      - application/json
      description: Approves a client's access request. Automatically generates a secure
        random password, creates a User account, updates request status to APPROVED,
        and emails login credentials to the client via Resend.
      parameters:
      - description: Access Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional Admin Notes
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.ApproveAccessRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Access request approved, account created, and credentials emailed
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "400":
          description: Bad request (already approved or invalid ID)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Approve Access Request & Email Credentials (Admin Only)
      tags:
      - Access Requests (Admin)
  /access-requests/{id}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a client's access request and marks status as REJECTED.
      parameters:
      - description: Access Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional Rejection Reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.RejectAccessRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Access request rejected
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Reject Access Request (Admin Only)
      tags:
      - Access Requests (Admin)
  /users:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of all users. Only accessible by admin
        and super_admin roles.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Users retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized — token missing or invalid
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all users (Admin only)
      tags:
      - Users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a user by ID. Only accessible by admin and super_admin
        roles.
      parameters:
      - description: User ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete user (Admin only)
      tags:
      - Users
    get:
      consumes:
      - application/json
      description: Retrieves a user's details by their MongoDB ObjectID. Requires
        authentication.
      parameters:
      - description: User ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Updates user details (name, email, phone, role). Requires authentication.
      parameters:
      - description: User ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - Users
  /users/change-password:
    put:
      consumes:
      - application/json
      description: Changes the authenticated user's password after validating current
        password.
      parameters:
      - description: Password change payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "400":
          description: Bad request or current password mismatch
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Profile
  /users/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a 6-digit OTP code to the registered email address if an
        account exists.
      parameters:
      - description: Registered Email Address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: If an account exists with this email, an OTP has been sent.
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Request password reset OTP
      tags:
      - Authentication
  /users/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password. Returns a JWT token
        containing the user's role (client/advisor/admin/super_admin). The frontend
        should use the role to redirect to the correct dashboard.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful — returns JWT token and user details with
            role
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.LoginResponse'
              type: object
        "401":
          description: Invalid credentials or account disabled
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Login user
      tags:
      - Authentication
  /users/me:
    get:
      consumes:
      - application/json
      description: Retrieves profile information for the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: Profile retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Profile
    put:
      consumes:
      - application/json
      description: Updates authenticated user's name and contact phone number. Email
        is immutable and cannot be modified.
      parameters:
      - description: Profile fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Profile
  /users/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with the specified details. Default
        role is 'client'.
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "400":
          description: Bad request (email already exists, etc.)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Register a new user
      tags:
      - Authentication
  /users/reset-password:
    post:
      consumes:
      - application/json
      description: Verifies the OTP code and updates the user's password in the database.
      parameters:
      - description: Email, OTP & New Password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "400":
          description: Invalid OTP, password mismatch or weak password
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Reset password using OTP
      tags:
      - Authentication
  /users/verify-otp:
    post:
      consumes:
      - application/json
      description: Validates if the provided 6-digit OTP code is valid, unexpired,
        and unused.
      parameters:
      - description: Email & 6-digit OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP verified successfully
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "400":
          description: Invalid or expired OTP code
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Verify password reset OTP
      tags:
      - Authentication
securityDefinitions:
  BearerAuth:
    description: 'Enter your Bearer token in the format: **Bearer &lt;token&gt;**'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
