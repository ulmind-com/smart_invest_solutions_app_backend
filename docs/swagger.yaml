basePath: /api/v1
definitions:
  github_com_smart-invest-solutions_backend_internal_domain.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      role:
        description: 'Role is usually set server-side (default: client) but could
          be requested'
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_pkg_response.APIResponse:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      message:
        type: string
      page:
        type: integer
      success:
        type: boolean
      total:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@ulmind.com
    name: ULMIND Team
  description: |-
    Backend API for Smart Invest Solutions — a LIC Policy & Investment Management Platform.
    This API provides user registration, authentication with JWT, role-based access control, and more.
  title: Smart Invest Solutions API
  version: "1.0"
paths:
  /users:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of all users. Only accessible by admin
        and super_admin roles.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Users retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized — token missing or invalid
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all users (Admin only)
      tags:
      - Users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a user by ID. Only accessible by admin and super_admin
        roles.
      parameters:
      - description: User ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete user (Admin only)
      tags:
      - Users
    get:
      consumes:
      - application/json
      description: Retrieves a user's details by their MongoDB ObjectID. Requires
        authentication.
      parameters:
      - description: User ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Updates user details (name, email, phone, role). Requires authentication.
      parameters:
      - description: User ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - Users
  /users/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password. Returns a JWT token
        containing the user's role (client/advisor/admin/super_admin). The frontend
        should use the role to redirect to the correct dashboard.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful — returns JWT token and user details with
            role
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.LoginResponse'
              type: object
        "401":
          description: Invalid credentials or account disabled
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Login user
      tags:
      - Authentication
  /users/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with the specified details. Default
        role is 'client'.
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "400":
          description: Bad request (email already exists, etc.)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Register a new user
      tags:
      - Authentication
securityDefinitions:
  BearerAuth:
    description: 'Enter your Bearer token in the format: **Bearer &lt;token&gt;**'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
