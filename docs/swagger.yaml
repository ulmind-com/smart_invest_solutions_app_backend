basePath: /api/v1
definitions:
  github_com_smart-invest-solutions_backend_internal_domain.AccessRequest:
    properties:
      admin_notes:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      status:
        description: PENDING, APPROVED, REJECTED
        type: string
      updated_at:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ApproveAccessRequestDTO:
    properties:
      admin_notes:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ChangePasswordRequest:
    properties:
      confirm_password:
        type: string
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - current_password
    - new_password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateAccessRequestDTO:
    properties:
      email:
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateFamilyMemberDTO:
    properties:
      blood_group:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      relation_with_hof:
        type: string
    required:
    - date_of_birth
    - name
    - phone
    - relation_with_hof
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateGeneralInsuranceDTO:
    properties:
      advisor_contact:
        type: string
      advisor_name:
        type: string
      company_name:
        type: string
      date_of_expiry:
        type: string
      policy_no:
        type: string
      vehicle_no:
        type: string
    required:
    - company_name
    - date_of_expiry
    - policy_no
    - vehicle_no
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      role:
        type: string
    required:
    - email
    - name
    - password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.FamilyMember:
    properties:
      blood_group:
        type: string
      created_at:
        type: string
      date_of_birth:
        description: 'Format: YYYY-MM-DD'
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      relation_with_hof:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    required:
    - date_of_birth
    - name
    - phone
    - relation_with_hof
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.FamilyMemberListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.FamilyMember'
        type: array
      total:
        type: integer
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.GeneralInsurance:
    properties:
      advisor_contact:
        type: string
      advisor_name:
        type: string
      company_name:
        type: string
      created_at:
        type: string
      date_of_expiry:
        description: 'Format: YYYY-MM-DD'
        type: string
      id:
        type: string
      policy_no:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      vehicle_no:
        type: string
    required:
    - company_name
    - date_of_expiry
    - policy_no
    - vehicle_no
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.GeneralInsuranceListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.GeneralInsurance'
        type: array
      total:
        type: integer
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.RejectAccessRequestDTO:
    properties:
      reason:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.ResetPasswordRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      new_password:
        minLength: 8
        type: string
      otp:
        type: string
    required:
    - confirm_password
    - email
    - new_password
    - otp
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateFamilyMemberDTO:
    properties:
      blood_group:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      relation_with_hof:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateGeneralInsuranceDTO:
    properties:
      advisor_contact:
        type: string
      advisor_name:
        type: string
      company_name:
        type: string
      date_of_expiry:
        type: string
      policy_no:
        type: string
      vehicle_no:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateProfileRequest:
    properties:
      name:
        type: string
      phone:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  github_com_smart-invest-solutions_backend_internal_domain.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
  github_com_smart-invest-solutions_backend_pkg_response.APIResponse:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      message:
        type: string
      page:
        type: integer
      success:
        type: boolean
      total:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact:
    email: support@ulmind.com
    name: ULMIND Team
  description: |-
    Backend API for Smart Invest Solutions — a LIC Policy & Investment Management Platform.
    This API provides user registration, authentication with JWT, role-based access control, and more.
  title: Smart Invest Solutions API
  version: "1.0"
paths:
  /access-requests:
    get:
      consumes:
      - application/json
      description: Retrieves all access requests with optional filtering by status
        (PENDING, APPROVED, REJECTED).
      parameters:
      - description: 'Filter by status: PENDING, APPROVED, REJECTED'
        in: query
        name: status
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Access requests retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
                  type: array
              type: object
        "401":
          description: Unauthorized — Bearer Token required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all Access Requests (Admin Only)
      tags:
      - Access Requests (Admin)
    post:
      consumes:
      - application/json
      description: Submits a request for access to the platform with Name, Contact
        No, and Email. Status is set to PENDING until approved by an Admin.
      parameters:
      - description: Access Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateAccessRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Access request submitted successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "400":
          description: Bad request (email already exists or pending request exists)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Request for Access (Client Sign up request)
      tags:
      - Access Requests
  /access-requests/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves detailed info for a single access request.
      parameters:
      - description: Access Request ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Access request retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "404":
          description: Request not found
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Access Request by ID (Admin Only)
      tags:
      - Access Requests (Admin)
  /access-requests/{id}/approve:
    post:
      consumes:
      - application/json
      description: Approves a client's access request. Automatically generates a secure
        random password, creates a User account, updates request status to APPROVED,
        and emails login credentials to the client via Resend.
      parameters:
      - description: Access Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional Admin Notes
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.ApproveAccessRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Access request approved, account created, and credentials emailed
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "400":
          description: Bad request (already approved or invalid ID)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Approve Access Request & Email Credentials (Admin Only)
      tags:
      - Access Requests (Admin)
  /access-requests/{id}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a client's access request and marks status as REJECTED.
      parameters:
      - description: Access Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional Rejection Reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.RejectAccessRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Access request rejected
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Reject Access Request (Admin Only)
      tags:
      - Access Requests (Admin)
  /family-members:
    get:
      consumes:
      - application/json
      description: Retrieves list of all family members added by the authenticated
        user along with total count N.
      produces:
      - application/json
      responses:
        "200":
          description: Family members retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.FamilyMemberListResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all my family members
      tags:
      - Family Members
    post:
      consumes:
      - application/json
      description: Creates a new family member record linked to the authenticated
        user.
      parameters:
      - description: Family Member Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateFamilyMemberDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Family member added successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.FamilyMember'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Add a new family member
      tags:
      - Family Members
  /family-members/{id}:
    delete:
      consumes:
      - application/json
      description: Removes a family member from the authenticated user's account.
      parameters:
      - description: Family Member ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Family member deleted successfully
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete family member
      tags:
      - Family Members
    get:
      consumes:
      - application/json
      description: Retrieves detailed info for a single family member.
      parameters:
      - description: Family Member ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Family member retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.FamilyMember'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "404":
          description: Family member not found
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get family member by ID
      tags:
      - Family Members
    put:
      consumes:
      - application/json
      description: Updates specific details (name, relation, phone, email, blood group,
        DOB) of a family member.
      parameters:
      - description: Family Member ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UpdateFamilyMemberDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Family member updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.FamilyMember'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "404":
          description: Family member not found
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update / Edit family member
      tags:
      - Family Members
  /family-members/user/{userId}:
    get:
      consumes:
      - application/json
      description: Retrieves all family members associated with a specific user ID
        for Admin/Advisor view.
      parameters:
      - description: Target Client User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Family members retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.FamilyMemberListResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get user's family members (Admin Only)
      tags:
      - Family Members (Admin)
  /general-insurances:
    get:
      consumes:
      - application/json
      description: Retrieves list of all general/vehicle insurance policies for the
        authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: General insurance policies retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.GeneralInsuranceListResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all my General Insurance policies
      tags:
      - General Insurance
    post:
      consumes:
      - application/json
      description: Creates a new general/vehicle insurance policy linked to the authenticated
        user account.
      parameters:
      - description: General Insurance Policy Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateGeneralInsuranceDTO'
      produces:
      - application/json
      responses:
        "201":
          description: General Insurance policy added successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.GeneralInsurance'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Add General Insurance policy
      tags:
      - General Insurance
  /general-insurances/{id}:
    delete:
      consumes:
      - application/json
      description: Removes a general insurance policy from the authenticated user
        account.
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Policy deleted successfully
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete General Insurance policy
      tags:
      - General Insurance
    get:
      consumes:
      - application/json
      description: Retrieves detailed info for a single general insurance policy.
      parameters:
      - description: General Insurance ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Policy retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.GeneralInsurance'
              type: object
