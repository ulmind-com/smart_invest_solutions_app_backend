info:
  contact:
    email: support@ulmind.com
    name: ULMIND Team
  description: |-
    Backend API for Smart Invest Solutions — a LIC Policy & Investment Management Platform.
    This API provides user registration, authentication with JWT, role-based access control, and more.
  title: Smart Invest Solutions API
  version: "1.0"
paths:
  /access-requests:
    get:
      consumes:
      - application/json
      description: Retrieves all access requests with optional filtering by status
        (PENDING, APPROVED, REJECTED).
      parameters:
      - description: 'Filter by status: PENDING, APPROVED, REJECTED'
        in: query
        name: status
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Access requests retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
                  type: array
              type: object
        "401":
          description: Unauthorized — Bearer Token required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all Access Requests (Admin Only)
      tags:
      - Access Requests (Admin)
    post:
      consumes:
      - application/json
      description: Submits a request for access to the platform with Name, Contact
        No, and Email. Status is set to PENDING until approved by an Admin.
      parameters:
      - description: Access Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateAccessRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Access request submitted successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "400":
          description: Bad request (email already exists or pending request exists)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Request for Access (Client Sign up request)
      tags:
      - Access Requests
  /access-requests/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves detailed info for a single access request.
      parameters:
      - description: Access Request ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Access request retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "404":
          description: Request not found
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Access Request by ID (Admin Only)
      tags:
      - Access Requests (Admin)
  /access-requests/{id}/approve:
    post:
      consumes:
      - application/json
      description: Approves a client's access request. Automatically generates a secure
        random password, creates a User account, updates request status to APPROVED,
        and emails login credentials to the client via Resend.
      parameters:
      - description: Access Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional Admin Notes
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.ApproveAccessRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Access request approved, account created, and credentials emailed
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
              type: object
        "400":
          description: Bad request (already approved or invalid ID)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Approve Access Request & Email Credentials (Admin Only)
      tags:
      - Access Requests (Admin)
  /access-requests/{id}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a client's access request and marks status as REJECTED.
      parameters:
      - description: Access Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional Rejection Reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.RejectAccessRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Access request rejected
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AccessRequest'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — Admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Reject Access Request (Admin Only)
      tags:
      - Access Requests (Admin)
  /admins:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of all admin and super_admin accounts.
        Only accessible by super_admin.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Admin accounts retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UserResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — super_admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all Admin accounts (Super Admin only)
      tags:
      - Admin Accounts
    post:
      consumes:
      - application/json
      description: Creates a new Admin account from Name/Email/Phone. Auto-generates
        a unique Admin ID, a random password, and a 4-digit PIN, then emails the credentials
        to the new admin. The response also returns the plaintext password/PIN once,
        so the Super Admin can share them even if the email fails to deliver. Only
        accessible by super_admin.
      parameters:
      - description: New Admin details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Admin account created successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CreateAdminResponse'
              type: object
        "400":
          description: Bad request (e.g. email already in use)
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — super_admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Create Admin account (Super Admin only)
      tags:
      - Admin Accounts
  /admins/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently deletes an admin account and its associated data. Self-deletion
        is disallowed — use the account settings delete option instead. Only accessible
        by super_admin.
      parameters:
      - description: Admin User ID (MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Admin account deleted successfully
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — super_admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete Admin account (Super Admin only)
      tags:
      - Admin Accounts
  /admins/login:
    post:
      consumes:
      - application/json
      description: Authenticates an admin or super_admin account using AdminID + PIN.
        Normal users (client/advisor) cannot log in through this endpoint — use POST
        /users/login instead. Returns a JWT token containing the user's role. Accounts
        lock for 15 minutes after 5 consecutive failed attempts.
      parameters:
      - description: Login credentials — Admin ID and 4-digit PIN
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful — returns JWT token and user details with
            role
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.LoginResponse'
              type: object
        "401":
          description: Invalid credentials, account disabled, or account temporarily
            locked
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      summary: Login (admin/super_admin)
      tags:
      - Authentication
  /agency/sync/lic-due-list:
    post:
      consumes:
      - multipart/form-data
      description: Uploads and parses an LIC Premium Due List PDF file, extracts policy
        numbers, assured names, DOC, FUP, Mode, and Premiums, calculates next due
        dates, updates existing policies in MongoDB, and returns unmapped policy records.
      parameters:
      - description: LIC Premium Due List PDF File (.pdf)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: LIC Premium Due List PDF processed successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.SyncResultDTO'
              type: object
        "400":
          description: Bad request — missing file or invalid PDF file format
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized — token missing or invalid
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Process LIC Premium Due List PDF (Admin only)
      tags:
      - Agency Sync
  /calculators/fd:
    post:
      consumes:
      - application/json
      description: Calculates total principal, estimated interest returns, and maturity
        value for a Fixed Deposit (FD). If interest_rate is omitted, the Admin's default
        FD rate is applied.
      parameters:
      - description: FD calculation parameters
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.FDRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: FD calculation completed successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CalculatorResponseDTO'
              type: object
        "400":
          description: Bad request — invalid parameters
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized — token missing or invalid
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Calculate Fixed Deposit (FD) returns
      tags:
      - Calculators
  /calculators/lumpsum:
    post:
      consumes:
      - application/json
      description: Calculates total invested amount, estimated returns, and final
        maturity value for a Lumpsum investment. If expected_return_rate is omitted,
        the Admin's default Lumpsum rate is applied.
      parameters:
      - description: Lumpsum calculation parameters
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.LumpsumRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Lumpsum calculation completed successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CalculatorResponseDTO'
              type: object
        "400":
          description: Bad request — invalid parameters
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized — token missing or invalid
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Calculate Lumpsum returns
      tags:
      - Calculators
  /calculators/settings:
    get:
      description: Retrieves the global default SIP, Lumpsum, and FD return rates
        configured by Admin.
      produces:
      - application/json
      responses:
        "200":
          description: Calculator settings retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CalculatorSettings'
              type: object
        "401":
          description: Unauthorized — token missing or invalid
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get global calculator default rates
      tags:
      - Calculators
    put:
      consumes:
      - application/json
      description: Updates the global default SIP, Lumpsum, or FD return rates used
        across client calculators when no rate is explicitly passed.
      parameters:
      - description: Updated calculator default rates
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.UpdateCalculatorSettingsDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Calculator settings updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.CalculatorSettings'
              type: object
        "400":
          description: Bad request — invalid input format
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "401":
          description: Unauthorized — token missing or invalid
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "403":
          description: Forbidden — admin role required
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update global calculator default rates (Admin only)
      tags:
      - Calculators
  /calculators/sip:
    post:
      consumes:
      - application/json
      description: Calculates total invested amount, estimated returns, and final
        maturity value for a Systematic Investment Plan (SIP). If expected_return_rate
        is omitted, the Admin's default SIP rate is applied.
      parameters:
      - description: SIP calculation parameters
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_smart-invest-solutions_backend_internal_domain.SIPRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: SIP calculation completed successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_smart-invest-solutions_backend_pkg_response.APIResponse'
